# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    # CodeRabbit only reviews the repository default branch unless base branches
    # are listed here. This repo's default branch is not `main`, so PRs targeting
    # `main` were silently skipped. `.*` opts every base branch in.
    base_branches:
      - ".*"
    # PRs opened by agent sessions start as drafts; CodeRabbit skips drafts by default.
    drafts: true
  path_filters:
    # Lockfiles are generated and dominate reviews with transitive-dependency CVE noise.
    - "!**/package-lock.json"
    - "!dist/**"
chat:
  auto_reply: true
