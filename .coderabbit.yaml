# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    # CodeRabbit only reviews the repository default branch unless base branches
    # are listed here. This repo's default branch is not `main`, and PRs are opened
    # against both `main` and feature branches, so some are silently skipped.
    # `.*` opts every base branch in.
    base_branches:
      - ".*"
    # PRs opened by agent sessions start as drafts; CodeRabbit skips drafts by default.
    drafts: true
    # Note: CodeRabbit silently skips bot-authored PRs (e.g. blocksorg[bot])
    # regardless of YAML settings. The coderabbit-bot-prs.yml workflow
    # works around this by posting @coderabbitai review via a human PAT
    # (CR_TRIGGER_TOKEN secret). There is no YAML option to override
    # CodeRabbit's author-eligibility check for bot accounts.
  path_filters:
    # Lockfiles are generated and dominate reviews with transitive-dependency CVE noise.
    - "!**/package-lock.json"
    - "!dist/**"
chat:
  auto_reply: true
