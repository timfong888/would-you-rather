name: Apple metadata (text only)

# Manual only. Pushes listing TEXT from store/ios/listing-final.json to App Store Connect
# (name, subtitle, description, keywords, promo text, URLs, copyright). DRY RUN unless
# "apply" is ticked, and apply is refused unless "approved": true is committed in the file.
# It never uploads builds or screenshots, never changes price or age rating, and never submits for review.
on:
  workflow_dispatch:
    inputs:
      app_id:
        description: ASC app id (Apple ID of the app)
        type: string
        required: true
        default: '6836653723'
      apply:
        description: Write to App Store Connect (leave off for a dry run)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync listing text
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APP_ID: ${{ inputs.app_id }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            node scripts/asc-metadata.mjs --app "$APP_ID" --apply
          else
            node scripts/asc-metadata.mjs --app "$APP_ID"
          fi
