name: Neville iOS (build and TestFlight)

# Manual only. Builds the Neville iOS app (timfong888/neville, bundle pckg.neville) on EAS and uploads it to
# TestFlight against ASC app 6740147041. Which app is built is the neville_dir choice: `ios-shell` (the old shell,
# default) or `native` (the Expo Router app, one UI codebase). Same EAS project, same bundle id, same ASC app. WRITES to App Store Connect; never submits for App Review, never
# touches the live version (the build must be >= 1.1.0, build > 157).
#
# Security (public repo, public logs, holds the ASC key and an Expo token):
# - dispatch only, only by timfong888, only from main (so only merged workflow code ever sees the secrets);
# - neville_dir is a choice of exactly `ios-shell` | `native`, re-checked in shell and in code against that allowlist;
#   the working dir is $RUNNER_TEMP/neville/<neville_dir>, never a free-text path, and the input is only ever passed
#   through env: (never interpolated into a run: script);
# - neville_sha must be a full sha that is an ancestor of neville's main, checked BEFORE any secret is used;
# - the repo/ref are hardcoded, never an input; contents: read; no artifacts; no pull_request_target;
# - secrets reach exactly one step; the .p8 goes to a 0600 temp file outside the checkout and is deleted;
# - the secretless check (scripts/neville-check.mjs) fails the run before any secret if the chosen dir is not self-contained
#   (native/ needs its own package.json, app.json, eas.json, the pckg.neville bundle id, the EAS profile, no parent or
#   workspace dependency) and reports whether metro.config.js or a package.json references a parent or workspaces;
# - EAS_PROFILE is explicit (production) and non-secret; the ASC preflight checks app 6740147041 against pckg.neville;
#   the job summary names the directory, version and build number;
# - third-party actions are pinned to commit SHAs; on success the only Apple data printed is build number and state.
#   On an `eas build` FAILURE the last 60 lines of EAS output are printed with secrets redacted; they can include
#   non-secret Apple-side names (team, certificate or profile labels). Accepted so a failed run can be debugged.
on:
  workflow_dispatch:
    inputs:
      neville_sha:
        description: Full 40-char commit sha on neville main (merged code only)
        type: string
        required: true
      neville_dir:
        description: Which neville directory to build
        type: choice
        options:
          - ios-shell
          - native
        default: ios-shell

permissions:
  contents: read

concurrency:
  group: neville-ios-testflight
  cancel-in-progress: false

env:
  NEVILLE_REPO: timfong888/neville
  EAS_PROFILE: production
  APPLE_TEAM_ID: VJKU43W3C2

jobs:
  neville-ios:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'timfong888' && github.triggering_actor == 'timfong888' && github.repository == 'timfong888/would-you-rather' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Key-holding job: runs only from main (GitHub environment branch rule, #246).
    environment: apple-ops
    timeout-minutes: 120
    steps:
      - name: Validate neville_sha format and neville_dir allowlist
        env:
          NEVILLE_SHA: ${{ inputs.neville_sha }}
          NEVILLE_SUBDIR: ${{ inputs.neville_dir }}
        run: |
          case "$NEVILLE_SUBDIR" in ios-shell|native) ;; *) echo "neville_dir must be ios-shell or native"; exit 1 ;; esac
          [[ "$NEVILLE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "neville_sha must be a full 40-char lowercase hex sha"; exit 1; }

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Neville lives OUTSIDE this repo's tree ($RUNNER_TEMP), so EAS/Expo never resolves this repo's
      # package.json workspace or metro.config.js. Public repo, hardcoded, cloned without credentials.
      - name: Clone neville outside the workspace and pin it to the requested sha (must be merged on main)
        env:
          NEVILLE_SHA: ${{ inputs.neville_sha }}
          NEVILLE_DEST: ${{ runner.temp }}/neville
        run: |
          git clone --no-tags "https://github.com/${NEVILLE_REPO}.git" "$NEVILLE_DEST"
          cd "$NEVILLE_DEST"
          git cat-file -e "${NEVILLE_SHA}^{commit}" || { echo "sha not found in neville"; exit 1; }
          git merge-base --is-ancestor "$NEVILLE_SHA" origin/main || { echo "sha is not an ancestor of neville main; refusing"; exit 1; }
          git checkout --detach "$NEVILLE_SHA"
          echo "building neville at ${NEVILLE_SHA:0:12}"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Expo SDK 58 (eas-cli, Metro) needs Node >= 22.13: native runs on 22, the shell stays on 20. Both literals.
          node-version: ${{ inputs.neville_dir == 'native' && '22' || '20' }}

      - name: Check the chosen neville directory is self-contained (no secrets)
        env:
          NEVILLE_ROOT: ${{ runner.temp }}/neville
          NEVILLE_SUBDIR: ${{ inputs.neville_dir }}
        run: node scripts/neville-check.mjs

      - name: Install neville dependencies (no scripts, no secrets)
        env:
          NEVILLE_ROOT: ${{ runner.temp }}/neville
          NEVILLE_SUBDIR: ${{ inputs.neville_dir }}
        run: |
          cd "$NEVILLE_ROOT/$NEVILLE_SUBDIR"
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else echo "no package-lock.json; skipping install"; fi

      - name: Build on EAS and upload to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          NEVILLE_ROOT: ${{ runner.temp }}/neville
          NEVILLE_SUBDIR: ${{ inputs.neville_dir }}
        run: node scripts/neville-testflight.mjs
