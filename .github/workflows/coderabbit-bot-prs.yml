name: Trigger CodeRabbit on bot-authored PRs

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  trigger-coderabbit:
    # CodeRabbit silently skips PRs authored by bot accounts (author eligibility).
    # This workflow posts @coderabbitai review as a comment to manually trigger it.
    if: github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post @coderabbitai review trigger
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '@coderabbitai review'
            });
