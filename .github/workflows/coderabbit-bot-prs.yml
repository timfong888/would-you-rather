name: Trigger CodeRabbit on Blocks-authored PRs

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  trigger-coderabbit:
    # CodeRabbit ignores @coderabbitai commands posted by bot accounts (github-actions[bot],
    # etc.) to prevent infinite bot loops. The comment must come from a human user with
    # write access. CR_TRIGGER_TOKEN must be a PAT (classic, repo scope) belonging to a
    # human collaborator — NOT the default GITHUB_TOKEN.
    # Restricted to blocksorg[bot] to avoid firing on Dependabot or other bots.
    # Draft PRs are excluded on `opened`; ready_for_review fires only on draft→ready.
    if: |
      github.event.pull_request.user.login == 'blocksorg[bot]' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post @coderabbitai review trigger
        # Use gh CLI (shell-based) instead of actions/github-script to avoid
        # the Node 20 deprecation warning on GitHub Actions runners.
        # CR_TRIGGER_TOKEN must be a human-owned PAT (classic, repo scope).
        env:
          GH_TOKEN: ${{ secrets.CR_TRIGGER_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            -f body='@coderabbitai review'
