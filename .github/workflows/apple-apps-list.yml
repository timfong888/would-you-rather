name: Apple apps list (read only)

# Manual only. Lists every app in the App Store Connect account with its latest TestFlight build.
# GET requests only: no builds, uploads or writes. Output: job summary + downloadable artifact.
on:
  workflow_dispatch:
    inputs:
      match:
        description: Case-insensitive regexp on app name or bundle ID (default lists everything)
        type: string
        required: false
        default: '.'

permissions:
  contents: read

concurrency:
  group: apple-apps-list
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: List apps
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          MATCH: ${{ inputs.match }}
        run: node scripts/asc-apps-list.mjs --out asc-apps-list
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: asc-apps-list
          path: asc-apps-list/
          retention-days: 7
