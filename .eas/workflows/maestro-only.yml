# Same Maestro flows as .github/workflows/ios-simulator-smoke.yml, run on Expo's infrastructure.
# Manual only (eas workflow:run); no triggers, so nothing spends Expo credits by itself.
name: maestro-only

jobs:
  maestro_test:
    type: maestro
    image: macos-sequoia-15.6-xcode-16.4
    params:
      maestro_version: 2.12.1
      build_id: 2080c1ed-0954-47f0-b9ee-52c7af3c83c9
      flow_path: ['.maestro-diag/q-update1.yaml','.maestro-diag/q-update2.yaml','.maestro-diag/q-maint.yaml','.maestro-diag/q-offline.yaml','.maestro-diag/q-conn.yaml','.maestro-diag/q-required.yaml']
